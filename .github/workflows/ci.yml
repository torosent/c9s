name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.0
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.63.0

      - name: gofumpt
        run: |
          if [ -n "$(gofumpt -l .)" ]; then
            echo "gofumpt diff:"
            gofumpt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: tests with race + coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 70.0) { print "FAIL: coverage " t "% < 70%"; exit 1 } }'
