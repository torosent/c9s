site_name: c9s - Apple Containers TUI
site_description: Declarative container management with a k9s-inspired TUI
site_url: https://torosent.github.io/c9s
repo_url: https://github.com/torosent/c9s
repo_name: torosent/c9s

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys
  - admonition
  - tables

nav:
  - Home: index.md
  - Install: install.md
  - Quick Start: quick-start.md
  - Architecture: architecture.md
  - Screens:
      - Overview: screens/index.md
      - Containers: screens/containers.md
      - Images: screens/images.md
      - Volumes: screens/volumes.md
      - Networks: screens/networks.md
      - Builder: screens/builder.md
      - Registry: screens/registry.md
      - System: screens/system.md
      - Build: screens/build.md
      - Run: screens/run.md
      - Errors: screens/errors.md
      - Pinned: screens/pinned.md
      - Pulses: screens/pulses.md
      - Xray: screens/xray.md
  - Configuration: configuration.md
  - Keybinds: keybinds.md
  - Hotkeys: hotkeys.md
  - Skins: skins.md
  - Streaming: streaming.md
  - Docker shim: docker-shim.md
  - k9s Migration: k9s-migration.md
  - Demos: demos-rendering.md
  - FAQ: faq.md
  - Contributing: contributing.md
